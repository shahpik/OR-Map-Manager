SSD:
  download_method: ARCGIS_REST
  download_s3_config:
    bucket: dtp-or-map-manager
    location: map-importer/raw
  download_rest_config:
    url: https://geo.abs.gov.au/arcgis/rest/services/ASGC2001/SSD/FeatureServer/0/query
    request_method: GET
    query:     
      where: 'ssd_name is not null'
      geometryType: 'esriGeometryPolygon'
      spatialRel: 'esriSpatialRelIntersects'
      Units: 'esriSRUnit_Foot'
      returnGeometry: 'true'
      returnDistinctValues: 'false'
      returnIdsOnly: 'false'
      returnCountOnly: 'false'
      returnExtentOnly: 'false'
      returnZ: 'false'
      returnM: 'false'
      multipatchOption: 'xyFootprint'
      returnTrueCurves: 'false'
      returnExceededLimitFeatures: 'false'
      returnCentroid: 'false'
      timeReferenceUnknownClient: 'false'
      sqlFormat: 'none'
      featureEncoding: 'esriDefault'
      f: 'geojson'
      resultRecordCount: '2000'
      outFields: '*'
  file_format: GEOJSON
  archive_s3: true
  archive_s3_config:
    bucket: dtp-or-map-manager
    location: map-importer/archive
  postprocessing: {}
  

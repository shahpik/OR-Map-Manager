HEX:
  download_method: H3_HEX
  download_h3_hex_config:
    bounding_box: [[140.2, -33.5], [150.6, -39.7]] # top-left, bottom-right (lon,lat)
    resolution: 6
  file_format: GEOJSON
  archive_s3: false

OSM:
  download_method: OSM
  file_format: OSM
  download_osm_config:
    #place_name: "Victoria, Australia"
    overpass_filters: |
      area["ISO3166-2"="AU-VIC"]->.searchArea;
      way
        ["highway"]
        ["motorcar"!~"no"]
        ["area"!~"yes"]   
        ["highway"!~"path|steps|corridor|elevator|escalator|proposed|bridleway|abandoned|platform|raceway"]
        ["access"!~"private"]
        ["service"!~"parking|parking_aisle|private|emergency_access"](area.searchArea);
      >;

VICMAP_TRANSPORT:
  download_method: ARCGIS_REST
  download_rest_config:
    url: https://services6.arcgis.com/GB33F62SbDxJjwEL/ArcGIS/rest/services/Vicmap_Transport/FeatureServer/1/query
    request_method: GET
    query: 
      where: '(("left_locality" NOT LIKE ''%(NSW)%'' AND "right_locality" NOT LIKE ''%(NSW)%'')
AND ("left_locality" NOT LIKE ''%(SA)%'' AND "right_locality" NOT LIKE ''%(SA)%''))'
      outFields: '*'
      returnGeometry: 'true'
      f: 'pgeojson'
      resultRecordCount: '2000'
  file_format: GEOJSON
  archive_s3: true
  archive_s3_config:
    bucket: dtp-or-map-manager
    location: map-importer/archive
  postprocessing: {}


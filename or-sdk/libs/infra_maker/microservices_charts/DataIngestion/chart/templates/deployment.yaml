apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-ingestion-service.fullname" . }}
  labels:
    {{- include "data-ingestion-service.labels" . | nindent 4 }}
spec:
{{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      {{- include "data-ingestion-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
    {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      labels:
        {{- include "data-ingestion-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "data-ingestion-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: data-ingestion-service-configmap
          configMap:
            name: data-ingestion-service-configmap
            items:
              - key: data-ingestion-service-config.yaml # Name of source file
                path: data-ingestion-service-configmap
      containers:
        - name: {{ .Chart.Name }}
          volumeMounts:
            - name: data-ingestion-service-configmap
              mountPath: /app/config.yaml # Desired mount file name
              subPath: data-ingestion-service-configmap
          env:
          - name: EXPERIMENT_MANAGER_ENDPOINT
            value: http://graphql-service.{{ .Release.Namespace }}
          - name: EXPERIMENT_MANAGER_WS_ENDPOINT
            value: ws://graphql-service.{{ .Release.Namespace }}
          - name: SPATIAL_ENDPOINT
            value: http://spatial-service.{{ .Release.Namespace }}
          - name: APP_PORT
            value: {{ .Values.app.port | quote }}
          - name: LOG_LEVEL
            value: {{ .Values.optimalReality.logLevel }}
          - name: VICROADS_API_SAVE_RATE
            value: {{ .Values.app.saveRate | quote }}
          - name: VICROADS_API_POLL_RATE
            value: {{ .Values.app.pollRate | quote }}
          - name: VICROADS_CCTV_API_POLL_RATE
            value: {{ .Values.app.cctvPollRate | quote }}
          - name: OR_MASTER_JWT
            value: {{ .Values.experimentManager.masterJWT }}
          - name: JULIA_NUM_THREADS
            value: {{ .Values.app.juliaThreads | quote }}
          - name: AWS_ACCESS_KEY_ID
            value: {{ .Values.tpoc.aws_access_key_id }}
          - name: AWS_SECRET_ACCESS_KEY
            value: {{ .Values.tpoc.aws_secret_access_key }}
          - name: AWS_REGION
            value: {{ .Values.tpoc.aws_region }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /live
              port: {{ .Values.app.port }}
            failureThreshold: 10
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.app.port }}
            failureThreshold: 10
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

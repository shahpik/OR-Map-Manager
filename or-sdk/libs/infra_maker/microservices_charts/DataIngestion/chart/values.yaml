replicaCount: 1

image:
  repository: data-ingestion-service
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  annotations:
    kubernetes.io/ingress.class: nginx

app:
  port: 7000
  saveRate: 120
  pollRate: 20
  cctvPollRate: 500
  juliaThreads: 8

resources:
  limits:
    cpu: 4000m
    # memory: 4096Mi
  requests:
    cpu: 1000m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 50
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

optimalReality:
  logLevel: INFO

tpoc:
  aws_access_key_id:
  aws_secret_access_key:
  aws_region: ap-southeast-2
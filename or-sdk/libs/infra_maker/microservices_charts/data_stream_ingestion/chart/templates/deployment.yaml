apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-stream-ingestion-service.fullname" . }}
  labels:
    {{- include "data-stream-ingestion-service.labels" . | nindent 4 }}
spec:
{{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      {{- include "data-stream-ingestion-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
    {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      labels:
        {{- include "data-stream-ingestion-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "data-stream-ingestion-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          env:
          - name: EXPERIMENT_MANAGER_ENDPOINT
            value: http://graphql-service.{{ .Release.Namespace }}
          - name: EXPERIMENT_MANAGER_WS_ENDPOINT
            value: ws://graphql-service.{{ .Release.Namespace }}
          - name: LOG_LEVEL
            value: {{ .Values.optimalReality.logLevel }}
          - name: OR_MASTER_JWT
            value: {{ .Values.experimentManager.masterJWT }}
          - name: AWS_ACCESS_KEY_ID
            value: {{ .Values.AWS_ACCESS_KEY_ID }}
          - name: AWS_SECRET_ACCESS_KEY
            value: {{ .Values.AWS_SECRET_ACCESS_KEY }}
          - name: REGION_NAME
            value: {{ .Values.REGION_NAME }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.port }}
              protocol: TCP
          livenessProbe:
            exec:
              command:
              - cat
              - /app/__init__.py
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
              - cat
              - /app/__init__.py
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

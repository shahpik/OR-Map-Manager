#
# Master Deployment pipeline
#

# the default agent pool
pool:
  vmImage: ubuntu-latest

# parameters are editable from the azure pipelines manual run
# todo: if these function well the deploymentEnvironment variable is surplus
parameters:
- name: EnvironmentName
  displayName: Run for which environment name 
  type: string
  default: test
- name: Namespace
  displayName: Run for which namespace
  type: string
  default: dot-test
- name: clusterName
  displayName: cluster to use to write to (can be parameterised based on env + client)
  type: string
  default: dot-test
- name: clientName
  displayName: client name
  type: string
  default: dot

# global variables
variables:
  artifactFeed: or-core-model
  buildUrl: $(System.TeamFoundationCollectionUri)/$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=results
  workingDirectory: . # ./client_config/'{{ parameters.ClientName }}'
  EnvironmentName: '${{ parameters.EnvironmentName }}'
  clientName: '${{ parameters.clientName }}'
  Namespace: '${{ parameters.Namespace }}'

jobs:
  - job: Deploy
    displayName: Deploy all microservices
    pool: $(clientName)
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'), not(eq(variables['deployOnly'], 'true')))
    steps:
      - task: Bash@3
        displayName: Configure Kubeconfig
        inputs:
          script: |
            aws eks update-kubeconfig --name='${{ parameters.clusterName }}' --region=ap-southeast-2 --role-arn=arn:aws:iam::438954004210:role/trusting-administratoraccess-role
          targetType: inline
          workingDirectory: $(workingDirectory)
      - task: Bash@3
        displayName: Deploy redis
        inputs:
          script: |
            make deploy TF_BUILD=true NAMESPACE=$(Namespace) ENVIRONMENT=$(EnvironmentName) STANDALONE=true CLIENT=$(clientName)
          targetType: inline
          workingDirectory: $(workingDirectory)/client_configs/TEMPLATE_CLIENT_NAME/microservices_charts/redis
      - task: Bash@3
        displayName: Deploy tile38
        inputs:
          script: |
            make deploy TF_BUILD=true NAMESPACE=$(Namespace) ENVIRONMENT=$(EnvironmentName) STANDALONE=true CLIENT=$(clientName)
          targetType: inline
          workingDirectory: $(workingDirectory)/client_configs/TEMPLATE_CLIENT_NAME/microservices_charts/tile38
      - task: Bash@3
        displayName: Deploy nginx
        inputs:
          script: |
            helm repo add "bitnami" "https://charts.bitnami.com/bitnami" 
            helm upgrade --install ext-dns --values values.external-dns.yaml bitnami/external-dns -n kube-system
            helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
            helm upgrade --install nginx-ing --values values.nginx-ingress.yaml ingress-nginx/ingress-nginx -n kube-system
          targetType: inline
          workingDirectory: $(workingDirectory)/client_configs/TEMPLATE_CLIENT_NAME/kubesys
      - task: Bash@3
        displayName: Await load balancer
        inputs:
          script: |
            sleep 1m
          targetType: inline
          workingDirectory: $(workingDirectory)
      - task: Bash@3
        displayName: Deploy graphql
        inputs:
          script: |
            make deploy TF_BUILD=true NAMESPACE=$(Namespace) ENVIRONMENT=$(EnvironmentName) STANDALONE=false CLIENT=$(clientName)
          targetType: inline
          workingDirectory: $(workingDirectory)/client_configs/TEMPLATE_CLIENT_NAME/microservices_charts/graphql_service
      - task: Bash@3
        displayName: Deploy SessionManager
        inputs:
          script: |
            make deploy TF_BUILD=true NAMESPACE=$(Namespace) ENVIRONMENT=$(EnvironmentName) STANDALONE=false CLIENT=$(clientName)
          targetType: inline
          workingDirectory: $(workingDirectory)/client_configs/TEMPLATE_CLIENT_NAME/microservices_charts/SessionManager
      - task: Bash@3
        displayName: Deploy DataLoader
        inputs:
          script: |
            make deploy TF_BUILD=true NAMESPACE=$(Namespace) ENVIRONMENT=$(EnvironmentName) STANDALONE=false CLIENT=$(clientName)
          targetType: inline
          workingDirectory: $(workingDirectory)/client_configs/TEMPLATE_CLIENT_NAME/microservices_charts/DataLoader
      - task: Bash@3
        displayName: Await DataLoader
        inputs:
          script: |
            sleep 15m # This needs to be replaced by a check to the init_complete
          targetType: inline
      - task: Bash@3
        displayName: Deploy Spatial
        inputs:
          script: |
            make deploy TF_BUILD=true NAMESPACE=$(Namespace) ENVIRONMENT=$(EnvironmentName) STANDALONE=false CLIENT=$(clientName)
          targetType: inline
          workingDirectory: $(workingDirectory)/client_configs/TEMPLATE_CLIENT_NAME/microservices_charts/Spatial
      - task: Bash@3
        displayName: Deploy ScheduleGeneration
        inputs:
          script: |
            make deploy TF_BUILD=true NAMESPACE=$(Namespace) ENVIRONMENT=$(EnvironmentName) STANDALONE=false CLIENT=$(clientName)
          targetType: inline
          workingDirectory: $(workingDirectory)/client_configs/TEMPLATE_CLIENT_NAME/microservices_charts/ScheduleGeneration
      - task: Bash@3
        displayName: Await ScheduleGeneration
        inputs:
          script: |
            sleep 5m 
          targetType: inline
      - task: Bash@3
        displayName: Deploy Metrics
        inputs:
          script: |
            make deploy TF_BUILD=true NAMESPACE=$(Namespace) ENVIRONMENT=$(EnvironmentName) STANDALONE=false CLIENT=$(clientName)
          targetType: inline
          workingDirectory: $(workingDirectory)/client_configs/TEMPLATE_CLIENT_NAME/microservices_charts/Metrics
      - task: Bash@3
        displayName: Deploy SimMetrics
        inputs:
          script: |
            make deploy TF_BUILD=true NAMESPACE=$(Namespace) ENVIRONMENT=$(EnvironmentName) STANDALONE=false CLIENT=$(clientName)
          targetType: inline
          workingDirectory: $(workingDirectory)/client_configs/TEMPLATE_CLIENT_NAME/microservices_charts/SimMetrics
      - task: Bash@3
        displayName: Deploy TrafficModel
        inputs:
          script: |
            make deploy TF_BUILD=true NAMESPACE=$(Namespace) ENVIRONMENT=$(EnvironmentName) STANDALONE=false CLIENT=$(clientName)
          targetType: inline
          workingDirectory: $(workingDirectory)/client_configs/TEMPLATE_CLIENT_NAME/microservices_charts/TrafficModel
      - task: Bash@3
        displayName: Deploy RealtimeManager
        inputs:
          script: |
            make deploy TF_BUILD=true NAMESPACE=$(Namespace) ENVIRONMENT=$(EnvironmentName) STANDALONE=false CLIENT=$(clientName)
          targetType: inline
          workingDirectory: $(workingDirectory)/client_configs/TEMPLATE_CLIENT_NAME/microservices_charts/RealtimeManager
      - task: Bash@3
        displayName: Deploy DataRecorder
        inputs:
          script: |
            make deploy TF_BUILD=true NAMESPACE=$(Namespace) ENVIRONMENT=$(EnvironmentName) STANDALONE=false CLIENT=$(clientName)
          targetType: inline
          workingDirectory: $(workingDirectory)/client_configs/TEMPLATE_CLIENT_NAME/microservices_charts/DataRecorder
      - task: Bash@3
        displayName: Deploy DataIngestion
        inputs:
          script: |
            make deploy TF_BUILD=true NAMESPACE=$(Namespace) ENVIRONMENT=$(EnvironmentName) STANDALONE=false CLIENT=$(clientName)
          targetType: inline
          workingDirectory: $(workingDirectory)/client_configs/TEMPLATE_CLIENT_NAME/microservices_charts/DataIngestion
      - task: Bash@3
        displayName: Deploy event_detection
        inputs:
          script: |
            make deploy TF_BUILD=true NAMESPACE=$(Namespace) ENVIRONMENT=$(EnvironmentName) STANDALONE=false CLIENT=$(clientName)
          targetType: inline
          workingDirectory: $(workingDirectory)/client_configs/TEMPLATE_CLIENT_NAME/microservices_charts/event_detection
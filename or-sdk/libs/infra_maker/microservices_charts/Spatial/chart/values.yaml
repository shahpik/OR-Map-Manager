

replicaCount: 1

image:
  repository: spatial-service
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}

  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}


service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  annotations:
    kubernetes.io/ingress.class: nginx

app:
  port: 1999
  juliaThreads: 4

resources:
  limits:
    cpu: 2000m
    # memory: 4096Mi
  requests:
    cpu: 1000m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 50

nodeSelector: {}

tolerations: []

affinity: {}

optimalReality:
  logLevel: INFO

tile38:
  endpoint: tile38:9851

tpoc:
  aws_access_key_id:
  aws_secret_access_key:
  aws_region: ap-southeast-2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "python-microservice-template.fullname" . }}
  labels:
    {{- include "python-microservice-template.labels" . | nindent 4 }}
spec:
{{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      {{- include "python-microservice-template.selectorLabels" . | nindent 6 }}
  template:
    metadata:
    {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      labels:
        {{- include "python-microservice-template.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "python-microservice-template.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          env:
          - name: EXPERIMENT_MANAGER_ENDPOINT
            value: http://graphql-service.{{ .Release.Namespace }}
          - name: EXPERIMENT_MANAGER_WS_ENDPOINT
            value: ws://graphql-service.{{ .Release.Namespace }}
          - name: APP_PORT
            value: {{ .Values.app.port | quote }}
          - name: LOG_LEVEL
            value: {{ .Values.optimalReality.logLevel }}
          - name: OR_MASTER_JWT
            value: {{ .Values.experimentManager.masterJWT }}
          - name: JULIA_NUM_THREADS
            value: {{ .Values.app.juliaThreads | quote }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /live
              port: {{ .Values.app.port }}
            failureThreshold: 10
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.app.port }}
            failureThreshold: 10
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

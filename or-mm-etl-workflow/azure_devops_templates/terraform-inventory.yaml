        printf '%s\n%s\n\n%s\n%s\n\n%s\n%s\n\n' "Included Directories:" "${include}" "Excluded Directories:" "${exclude}" "Inventory:" "${inventory}"
        outputValue=$(echo $inventory)

        echo "##[command]Outputting the following result to the pipeline as 'inventory':"
        echo "##[command]$outputValue"

        echo "##vso[task.setvariable variable=INVENTORY;]$outputValue"

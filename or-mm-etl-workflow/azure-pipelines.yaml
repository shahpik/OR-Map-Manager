trigger:
  branches:
    include:
      - '*'
    exclude:
      - refs/pull/*
      - main

parameters:
- name: environments
  type: object
  default:
    - environment: dev
    - environment: ppr
    - environment: prd

variables:
  - name: terraformVersion
    value: 1.2.5
  - name: webHookendpoint
    value: 'https://deloitte.webhook.office.com/webhookb2/a9826a76-c9df-4364-9824-2941e234d349@36da45f1-dd2c-4d1f-af13-5abe46b99921/IncomingWebhook/9b54cfb819b44693afd7201aa2639e4e/de423b8a-0d9f-4303-9fd1-0aeb3a9a1715'
  - group: 'aws-credentials'
  - name: OR_BUILD_ACCOUNT_ID
    value: 33a18168-03fb-4c7d-a478-6aecdc702d4d
  - name: PRISMA_VARIABLE_GROUP
    value: prisma-credentials


stages:
  - stage: Install_Lambda_Dependencies
    displayName: 'Install Lambda dependencies'
    pool:
      vmImage: ubuntu-latest
    # dependsOn: [] # allow parallel execution
    jobs:
      - job: Install_Lambda_Dependencies
        displayName: 'Install Lambda dependencies'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.8'
            displayName: 'Install Python 3.8'
          - task: Bash@3
            displayName: "Install Lambda dependencies"
            inputs:
              targetType: 'inline'
              script: |
                pip install --target modules/step_function/lambda -r modules/step_function/lambda/requirements.txt
                ls -la modules/step_function/lambda
                mkdir -p $(Build.ArtifactStagingDirectory)/step_function/modules
                cp -a modules $(Build.ArtifactStagingDirectory)/
                ls -la $(Build.ArtifactStagingDirectory)
          - task: Bash@3
            displayName: "Output build information"
            inputs:
              targetType: 'inline'
              script: |
                echo "Build.SourceVersionMessage: $(Build.SourceVersionMessage)"
                echo "Build.RequestedFor: $(Build.RequestedFor)"
                echo "Build.RequestedForId: $(Build.RequestedForId)"
                echo "Build.SourceBranch: $(Build.SourceBranch)"
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'plan'
              publishLocation: 'Container'
      
  - ${{ each environment in parameters.environments }}:
    - stage: Terraform_Plan_${{environment.environment}}
      displayName: 'Terraform Plan ${{environment.environment}}'
      pool:
        vmImage: ubuntu-latest
      dependsOn: Install_Lambda_Dependencies
      jobs:
        - deployment:
          displayName: 'Terraform Plan Check - ${{ environment.environment }}'
          environment: ${{environment.environment}}-terraform-mm-approver
        - job: Terraform
          variables:
          - group: "${{ variables.PRISMA_VARIABLE_GROUP }}"
          displayName: 'Terraform'
          steps:
            - task: TerraformInstaller@1
              displayName: 'Terraform Installer'
              inputs:
                terraformVersion: $(terraformVersion)
                
            - task: UsePythonVersion@0
              inputs:
                versionSpec: '3.8'
              displayName: 'Install Python 3.8'
                
            - task: InstallSSHKey@0
              inputs:
                knownHostsEntry: '|1|EG23y3SuKXlyTqS0XGNoI2m813Y=|2I81dE2GnKqyYBPbLU2eVqCEazk= ssh-rsa '
                sshPublicKey: 'ssh-rsa '
                sshKeySecureFile: 'terraform_id_rsa'
                addEntryToConfig: true
                configHostname: 'ssh.dev.azure.com'
                configHostAlias: 'ssh.dev.azure.com'

            # - task: InstallSSHKey@0
            #   inputs:
            #     knownHostsEntry: '|1|8xMSfHLjmnZk2cROd6UFnP3Oj4o=|+jmc1/kkf8uJWe00Qb3PCRjZXhc= ssh-rsa '
            #     sshPublicKey: 'ssh-rsa '
            #     sshKeySecureFile: 'dvcs_id_rsa'
            #     addEntryToConfig: true
            #     configHostname: 'dvcs.deloittedigital.com.au'
            #     configHostAlias: 'dvcs.deloittedigital.com.au'

            - task: Bash@3
              displayName: "Set aws config profile"
              env:
                AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                AWS_REGION: ap-southeast-2
                AWS_PROFILE: or-mgt
              inputs:
                targetType: 'inline'
                script: |
                  aws --profile $AWS_PROFILE configure set aws_access_key_id $AWS_ACCESS_KEY_ID
                  aws --profile $AWS_PROFILE configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
                  aws --profile $AWS_PROFILE configure set region $AWS_REGION

            # - task: Bash@3
            #   displayName: "Assume Role to DEV/TST/PPR/PRD"
            #   inputs:
            #     targetType: 'inline'
            #     script: |
            #       DEV=$(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" \
            #       $(aws sts assume-role \
            #         --role-arn arn:aws:iam::729234215193:role/trusting-administratoraccess-role \
            #         --role-session-name AzureDevOps \
            #         --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
            #         --output text))

            #       # TST=$(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" \
            #       # $(aws sts assume-role \
            #       #   --role-arn arn:aws:iam::543353361632:role/trusting-administratoraccess-role \
            #       #   --role-session-name AzureDevOps \
            #       #   --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
            #       #   --output text))

            #       # PPR=$(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" \
            #       # $(aws sts assume-role \
            #       #   --role-arn arn:aws:iam::388223041415:role/trusting-administratoraccess-role \
            #       #   --role-session-name AzureDevOps \
            #       #   --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
            #       #   --output text))

            #       # PRD=$(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" \
            #       # $(aws sts assume-role \
            #       #   --role-arn arn:aws:iam::222150071105:role/trusting-administratoraccess-role \
            #       #   --role-session-name AzureDevOps \
            #       #   --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
            #       #   --output text))

            #   env:
            #     AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
            #     AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
            #     AWS_REGION: ap-southeast-2

            - template: azure_devops_templates/terraform-inventory.yaml
              parameters:
                name: 'tf_inventory'
                env: ${{environment.environment}}

            # - task: UsePythonVersion@0
            #   inputs:
            #     versionSpec: '3.8'
            #   displayName: 'Install Python 3.8'

            # - task: Bash@3
            #   displayName: "Install Lambda dependencies"
            #   inputs:
            #     targetType: 'inline'
            #     script: |
            #       pip install --target modules/step_function/lambda -r modules/step_function/lambda/requirements.txt
            #       ls -la modules/step_function/lambda
            #       mkdir -p $(Build.ArtifactStagingDirectory)/step_function/modules
            #       cp -r modules $(Build.ArtifactStagingDirectory)/

            - template: azure_devops_templates/terraform-plan.yaml
              parameters:
                name: 'tf_plan'

            - script: pip install checkov
              displayName: 'Install Checkov'
            # - script: |
            #     checkov -d . --bc-api-key $(CHECKOV_USERNAME)::$(CHECKOV_PASSWORD)  --branch feature/test_prisma_scan --use-enforcement-rules  --framework terraform  --repo-id Optimal-Reality/env-or-client-dot-terraform --soft-fail
            #   displayName: 'Scan with Prisma Cloud'
            #   env:
            #     PRISMA_API_URL: "https://api.anz.prismacloud.io"

            - task: Bash@3
              name: "Copy_artifacts"
              displayName: 'Copy artifacts'
              inputs:
                targetType: 'inline'
                script: |
                  directories=$(find . -name 'tfplan' -printf '%h\n' | sort)
                  echo -e "List of directories to copy tfplan files in :\n${directories}\n"
                  mkdir -p $(Build.ArtifactStagingDirectory)/mm_resources
                  for directory in $directories;
                      do
                      # echo "Copying tfplan file from ${directory} directory"
                      # cp ${directory}/tfplan $(Build.ArtifactStagingDirectory)
                      echo "Copying terraform related files from ${directory} directory to artifact staging directory"
                      cp -r ${directory}/ $(Build.ArtifactStagingDirectory)/mm_resources/
                  done;

            - task: Bash@3
              displayName: "Output build information"
              inputs:
                targetType: 'inline'
                script: |
                  echo "Build.SourceVersionMessage: $(Build.SourceVersionMessage)"
                  echo "Build.RequestedFor: $(Build.RequestedFor)"
                  echo "Build.RequestedForId: $(Build.RequestedForId)"
                  echo "Build.SourceBranch: $(Build.SourceBranch)"

            - task: PublishBuildArtifacts@1
              inputs:
                PathtoPublish: '$(Build.ArtifactStagingDirectory)'
                ArtifactName: 'plan'

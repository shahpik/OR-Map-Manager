    - stage: Deploy${{environment.environment}}
      dependsOn: Terraform_Plan_${{environment.environment}}
      displayName: 'Deploy to ${{environment.environment}} Environment'
      
      jobs:
        - deployment: deploy${{environment.environment}}
          displayName: 'Terraform Apply ${{environment.environment}}'
          pool:
            vmImage: ubuntu-latest
          environment: ${{environment.environment}}-terraform-mm-approver
          strategy:
            runOnce:
              deploy:
                steps:
                  - task: TerraformInstaller@1
                    displayName: 'Terraform Installer'
                    inputs:
                      terraformVersion: $(terraformVersion)

                  - task: Bash@3
                    displayName: "Set aws config profile"
                    env:
                      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                      AWS_REGION: ap-southeast-2
                      AWS_PROFILE: or-mgt
                    inputs:
                      targetType: 'inline'
                      script: |
                        aws --profile $AWS_PROFILE configure set aws_access_key_id $AWS_ACCESS_KEY_ID
                        aws --profile $AWS_PROFILE configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
                        aws --profile $AWS_PROFILE configure set region $AWS_REGION

                  - task: Bash@3
                    displayName: "Assume role to ${{environment.environment}}"
                    inputs:
                      targetType: 'inline'
                      script: |
                        ${{environment.environment}}=$(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" \
                        $(aws sts assume-role \
                          --role-arn arn:aws:iam::729234215193:role/trusting-administratoraccess-role \
                          --role-session-name AzureDevOps \
                          --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
                          --output text))

                    env:
                      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                      AWS_REGION: ap-southeast-2

                      scritps: |
                        pwd
                        find -d .terraform

                  - template: azure_devops_templates/terraform-pathfix.yaml
                    parameters:
                      name: 'tf_path_fix'
                      path: 'plan'
                      env: ${{environment.environment}}

                  - template: azure_devops_templates/terraform-apply.yaml
                    parameters:
                      name: 'tf_apply'
                      env: ${{environment.environment}}
